name: CI

on:
  push:
  pull_request:

jobs:
  windows-msvc:
    name: Windows MSVC
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Test Windows automation scripts
        shell: pwsh
        timeout-minutes: 10
        run: scripts/windows-script-self-tests.ps1
