name: CI

on:
  push:
  pull_request:

jobs:
  windows-msvc:
    name: Windows MSVC
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DSAR_BUILD_GUI_VSTGUI=ON

      - name: Build native virtual device client
        run: cmake --build build --config Release --target sar_gui_virtual_device_client_smoke

      - name: Test native virtual device client
        run: ctest --test-dir build -C Release --output-on-failure -R "^gui_virtual_device_client_smoke$"

      - name: Build native control panel
        run: cmake --build build --config Release --target sar_gui_vstgui

      - name: Upload VSTGUI preview
        uses: actions/upload-artifact@v4
        with:
          name: system-audio-route-vstgui-preview
          path: |
            build/Release/SystemAudioRouteVstgui.exe
            build/Release/licenses/
            build/Release/LICENSE
            build/Release/NOTICE.md
          if-no-files-found: error
          retention-days: 7

      - name: Upload native GUI diagnostic symbols
        uses: actions/upload-artifact@v4
        with:
          name: system-audio-route-vstgui-symbols
          path: |
            build/Release/SystemAudioRouteVstgui.pdb
            build/gui-vstgui.map
          if-no-files-found: error
          retention-days: 3

      - name: Test native GUI startup and graceful close
        shell: pwsh
        run: scripts/windows-vstgui-startup-smoke.ps1 -Executable build/Release/SystemAudioRouteVstgui.exe -OutputDirectory build/native-gui-startup

      - name: Upload native GUI startup report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: system-audio-route-vstgui-startup
          path: build/native-gui-startup/
          if-no-files-found: ignore
          retention-days: 3

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Test Windows automation scripts
        shell: pwsh
        timeout-minutes: 10
        run: scripts/windows-script-self-tests.ps1

      - name: Record matrix lab build identity
        shell: pwsh
        run: |
          @{
            commit = '${{ github.sha }}'
            run_id = '${{ github.run_id }}'
            binaries = @(Get-FileHash build/Release/sar_engine_service.exe,
              build/Release/sar_control_cli.exe -Algorithm SHA256 |
              Select-Object Path, Hash)
          } | ConvertTo-Json -Depth 4 |
            Set-Content build/Release/matrix-lab-build.json -Encoding utf8

      - name: Upload public WASAPI matrix lab tools
        uses: actions/upload-artifact@v4
        with:
          name: system-audio-route-matrix-lab-tools
          path: |
            build/Release/sar_engine_service.exe
            build/Release/sar_control_cli.exe
            build/Release/matrix-lab-build.json
            scripts/windows-virtual-wasapi-matrix-preflight.ps1
            scripts/windows-lab-process.psm1
            scripts/windows-virtual-wasapi-signal-evidence.psm1
            LICENSE
            NOTICE.md
            third_party/libsamplerate/COPYING
            third_party/asio_sdk_2.3.4/common/LICENSE.txt
          if-no-files-found: error
          retention-days: 3

  windows-asan:
    name: Windows AddressSanitizer (advisory)
    runs-on: windows-latest
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Load MSVC build environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure with AddressSanitizer
        run: >-
          cmake -S . -B build-asan -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_FLAGS="/Zi /fsanitize=address"
          -DCMAKE_CXX_FLAGS="/EHsc /Zi /fsanitize=address"

      - name: Build portable smoke tests
        run: >-
          cmake --build build-asan --target
          sar_control_wire_protocol_smoke
          sar_control_codec_mutation_smoke
          sar_preset_file_codec_smoke
          sar_session_file_codec_smoke
          sar_virtual_asio_broker_protocol_smoke
          sar_virtual_asio_broker_protocol_mutation_smoke
          sar_planar_audio_fifo_smoke

      - name: Run smoke tests
        run: >-
          ctest --test-dir build-asan --output-on-failure
          -R "control_wire_protocol_smoke|control_codec_mutation_smoke|preset_file_codec_smoke|session_file_codec_smoke|virtual_asio_broker_protocol_smoke|virtual_asio_broker_protocol_mutation_smoke|planar_audio_fifo_smoke"
