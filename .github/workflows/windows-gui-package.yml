name: Windows GUI Package

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-gui-package:
    name: Windows Qt GUI package
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt 6.8.3
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.8.3
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          archives: qtbase qtdeclarative
          cache: true

      - name: Load MSVC build environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure GUI build
        shell: pwsh
        run: >-
          cmake -S . -B build-alpha
          -G Ninja
          -DSAR_BUILD_GUI=ON
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_PREFIX_PATH="$env:Qt6_DIR"

      - name: Build package targets
        run: cmake --build build-alpha --config Release

      - name: Run tests
        run: ctest --test-dir build-alpha -C Release --output-on-failure

      - name: Install NSIS
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $makensis = 'C:\Program Files (x86)\NSIS\makensis.exe'
          for ($attempt = 1; $attempt -le 3 -and !(Test-Path $makensis); $attempt++) {
            choco install nsis --no-progress -y
            if (!(Test-Path $makensis)) {
              Start-Sleep -Seconds (5 * $attempt)
            }
          }
          if (!(Test-Path $makensis)) {
            winget install --id NSIS.NSIS --exact --silent `
              --accept-package-agreements --accept-source-agreements
          }
          if (!(Test-Path $makensis)) {
            throw 'NSIS installation completed without makensis.exe.'
          }
          Split-Path $makensis | Out-File -FilePath $env:GITHUB_PATH `
            -Encoding utf8 -Append

      - name: Create Windows packages
        run: cpack --config build-alpha/CPackConfig.cmake -C Release -B build-alpha/package-output

      - name: Validate ZIP package
        shell: pwsh
        run: >-
          scripts/windows-alpha-package-acceptance.ps1
          -PackagePath (Get-ChildItem build-alpha/package-output/*.zip | Select-Object -First 1).FullName

      - name: Validate installer package
        shell: pwsh
        run: >-
          scripts/windows-installer-acceptance.ps1
          -PackagePath (Get-ChildItem build-alpha/package-output/*.exe | Select-Object -First 1).FullName

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: SystemAudioRoute-windows-x64-${{ github.sha }}
          path: |
            build-alpha/package-output/*.zip
            build-alpha/package-output/*.exe
          if-no-files-found: error
          retention-days: 30
